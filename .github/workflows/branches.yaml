name: KMP branch build

on:
  push:
    branches:
      - 'feature/**'
  release:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '18'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNGIN_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNIN_KEY_ID }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNIN_KEY_PASSWORD }}
      run: chmod +x gradlew
#     - name: Build with Gradle
#       run: |
#         ./gradlew wrapper --gradle-version 8.7.2 --distribution-type bin
#         ./gradlew build
    - name: Build snapshot
      run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache