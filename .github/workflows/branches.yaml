name: KMP branch build

on:
  push:
    branches:
      - 'feature/**'
  release:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '18'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
#     - name: Build with Gradle
#       run: |
#         ./gradlew wrapper --gradle-version 8.7.2 --distribution-type bin
#         ./gradlew build
    - name: Build and Release to Maven Central
      id: release
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -Prelease.versionCreator=simple
    - run: echo ${{ steps.release.outputs.released-version }}